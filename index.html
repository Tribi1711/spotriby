<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spotriby</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spotriby">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-base:       #000000;
  --bg-elevated:   #121212;
  --bg-highlight:  #1a1a1a;
  --bg-sidebar:    #0a0a0a;
  --bg-card:       #181818;
  --bg-card-hover: #282828;
  --bg-player:     #121212;
  --bg-progress:   #3e3e3e;
  --accent:        #1DB954;
  --accent-hover:  #1ed760;
  --text-base:     #FFFFFF;
  --text-subdued:  #b3b3b3;
  --border:        #282828;
  --scrollbar:     #282828;
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --player-height: 90px;
  --nav-height:    64px;
  --sidebar-w:     240px;
  --np-panel-w:    360px;
  --radius-sm:     4px;
  --radius-md:     8px;
  --radius-full:   9999px;
  --transition:    0.2s ease;
}

html, body {
  height: 100%;
  background: var(--bg-base);
  color: var(--text-base);
  font-family: var(--font);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#app {
  display: grid;
  grid-template-areas:
    "sidebar topbar   np-panel"
    "sidebar main     np-panel"
    "player  player   player";
  grid-template-columns: var(--sidebar-w) 1fr 0px;
  grid-template-rows: var(--nav-height) 1fr var(--player-height);
  height: 100vh;
  overflow: hidden;
  transition: grid-template-columns 0.4s cubic-bezier(0.4,0,0.2,1);
}
#app.panel-open {
  grid-template-columns: var(--sidebar-w) 1fr var(--np-panel-w);
}

#topbar {
  grid-area: topbar;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  z-index: 10;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.topbar-nav { display: flex; gap: 8px; }
.btn-nav {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  border: none;
  color: var(--text-base);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  opacity: 0.7;
  transition: opacity var(--transition);
}
.btn-nav:hover { opacity: 1; }
.search-bar {
  flex: 1; max-width: 364px;
  position: relative; display: flex; align-items: center;
}
.search-bar svg { position: absolute; left: 12px; color: #000; pointer-events: none; }
.search-bar input {
  width: 100%;
  background: #fff;
  color: #000;
  border: none;
  border-radius: var(--radius-full);
  padding: 8px 16px 8px 40px;
  font-family: var(--font);
  font-size: 14px; font-weight: 500;
  outline: none;
  transition: all var(--transition);
}
.search-bar input::placeholder { color: #6a6a6a; }
.search-bar input:focus { box-shadow: 0 0 0 3px var(--accent); }
.topbar-spacer { flex: 1; }
.user-badge {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card);
  border-radius: var(--radius-full);
  padding: 4px;
  cursor: pointer;
  transition: background var(--transition);
}
.user-badge:hover { background: var(--bg-card-hover); }
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 11px; color: #000;
}
.user-name { font-weight: 700; font-size: 13px; padding-right: 8px; }
.hamburger {
  display: none; background: none; border: none;
  color: var(--text-base); cursor: pointer; padding: 4px;
}

#sidebar {
  grid-area: sidebar;
  background: var(--bg-sidebar);
  display: flex; flex-direction: column;
  overflow: hidden;
  border-right: 1px solid rgba(255,255,255,0.05);
}
.sidebar-logo {
  padding: 24px 24px 8px;
  display: flex; align-items: center; gap: 10px;
  animation: fadeSlideIn 0.5s ease both;
}
.logo-img {
  width: 32px; height: 32px; object-fit: contain;
  cursor: pointer; border-radius: 6px;
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(29,185,84,0.3)); }
  50% { transform: scale(1.1); filter: drop-shadow(0 0 12px rgba(29,185,84,0.8)); }
}
.sidebar-logo span {
  font-size: 20px; font-weight: 900; letter-spacing: -0.5px;
  background: linear-gradient(90deg, #fff 0%, var(--accent) 40%, #fff 60%, var(--accent) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: textShimmer 4s linear infinite;
}
@keyframes textShimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.sidebar-nav { padding: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; border-radius: var(--radius-sm);
  cursor: pointer; color: var(--text-subdued);
  font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
  transition: color var(--transition), background var(--transition);
  user-select: none;
}
.nav-item:hover { color: var(--text-base); }
.nav-item.active { color: var(--text-base); }
.sidebar-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 8px 0; }
.sidebar-section-title {
  padding: 16px 24px 8px;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-subdued);
}
.playlist-list {
  flex: 1; overflow-y: auto; padding: 0 8px 8px;
}
.playlist-list::-webkit-scrollbar { width: 6px; }
.playlist-list::-webkit-scrollbar-track { background: transparent; }
.playlist-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
.song-item {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background var(--transition);
  position: relative;
}
.song-item:hover { background: var(--bg-card-hover); }
.song-item.active { background: var(--bg-card-hover); }
.song-cover-sm {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  object-fit: cover; flex-shrink: 0; background: var(--bg-card);
}
.song-cover-placeholder-sm {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-subdued); flex-shrink: 0;
}
.song-info-sm { flex: 1; min-width: 0; }
.song-title-sm {
  font-size: 13px; font-weight: 500; color: var(--text-base);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
}
.song-item.active .song-title-sm { color: var(--accent); }
.song-artist-sm {
  font-size: 12px; color: var(--text-subdued);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4;
}
.song-duration-sm { font-size: 12px; color: var(--text-subdued); flex-shrink: 0; }
.playing-icon {
  position: absolute; left: 18px;
  width: 28px; height: 28px;
  background: rgba(0,0,0,0.6); border-radius: var(--radius-sm);
  display: none; align-items: center; justify-content: center;
}
.song-item.active .playing-icon { display: flex; }
.playing-bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.bar {
  width: 3px; background: var(--accent); border-radius: 1px;
  animation: barBounce 1.2s ease-in-out infinite;
}
.bar:nth-child(1) { animation-delay: 0s; height: 8px; }
.bar:nth-child(2) { animation-delay: 0.2s; height: 12px; }
.bar:nth-child(3) { animation-delay: 0.4s; height: 6px; }
@keyframes barBounce {
  0%,100% { transform: scaleY(0.5); }
  50% { transform: scaleY(1); }
}
.paused .bar { animation-play-state: paused; }

#main {
  grid-area: main;
  overflow-y: auto;
  background: var(--bg-elevated);
  position: relative;
}
#main::-webkit-scrollbar { width: 10px; }
#main::-webkit-scrollbar-track { background: transparent; }
#main::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 5px; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes cardEntrance {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes spin { to { transform: rotate(360deg); } }

.view-panel { display: none; }
.view-panel.active { display: block; animation: scaleIn 0.25s ease both; }

.home-greeting {
  position: sticky; top: 0; z-index: 5;
  background: rgba(18,18,18,0.95);
  backdrop-filter: blur(20px);
  padding: 16px 24px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.home-greeting-text {
  font-size: 24px; font-weight: 900;
  letter-spacing: -0.5px;
  color: var(--text-base);
}
.home-filters {
  display: flex; gap: 8px; padding: 12px 24px 0;
  overflow-x: auto; scrollbar-width: none;
}
.home-filters::-webkit-scrollbar { display: none; }
.home-filter-btn {
  background: rgba(255,255,255,0.15);
  color: var(--text-base); border: none;
  border-radius: 20px; padding: 8px 16px;
  font-size: 13px; font-weight: 700;
  font-family: var(--font);
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: background 0.15s, transform 0.15s;
}
.home-filter-btn:hover { background: rgba(255,255,255,0.25); }
.home-filter-btn.active { background: var(--text-base); color: #000; }

.home-quick-section {
  padding: 20px 24px 0;
}
.home-quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.quick-pill {
  display: flex; align-items: center; gap: 0;
  background: rgba(255,255,255,0.08);
  border-radius: 6px; overflow: hidden;
  cursor: pointer; height: 56px;
  transition: background 0.15s, transform 0.15s;
  position: relative;
}
.quick-pill:hover { background: rgba(255,255,255,0.14); }
.quick-pill:active { transform: scale(0.97); }
.quick-pill-cover {
  width: 56px; height: 56px; flex-shrink: 0;
  background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.quick-pill-cover img { width: 56px; height: 56px; object-fit: cover; }
.quick-pill-label {
  font-size: 13px; font-weight: 700; color: var(--text-base);
  padding: 0 12px; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.quick-pill-play {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #000; margin-right: 8px; flex-shrink: 0;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 8px 24px rgba(29,185,84,0.5);
}
.quick-pill:hover .quick-pill-play { opacity: 1; transform: translateY(0); }

.home-np-banner {
  margin: 20px 24px 0;
  background: linear-gradient(90deg, rgba(29,185,84,0.18) 0%, rgba(29,185,84,0.06) 100%);
  border: 1px solid rgba(29,185,84,0.25);
  border-radius: 12px;
  padding: 16px;
  display: flex; align-items: center; gap: 16px;
  cursor: pointer;
  transition: border-color 0.2s;
  animation: fadeSlideIn 0.4s ease both;
}
.home-np-banner:hover { border-color: rgba(29,185,84,0.5); }
.hnp-cover {
  width: 56px; height: 56px; border-radius: 8px;
  overflow: hidden; flex-shrink: 0;
  background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
}
.hnp-cover img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
.hnp-info { flex: 1; min-width: 0; }
.hnp-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--accent);
  display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
}
.hnp-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  animation: pulseGreen 1.5s ease-in-out infinite;
}
@keyframes pulseGreen {
  0%,100% { box-shadow: 0 0 0 0 rgba(29,185,84,0.6); }
  50% { box-shadow: 0 0 0 8px rgba(29,185,84,0); }
}
.hnp-title {
  font-size: 16px; font-weight: 800; color: var(--text-base);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hnp-artist { font-size: 13px; color: var(--text-subdued); }
.hnp-play-btn {
  width: 48px !important; height: 48px !important;
  box-shadow: 0 4px 16px rgba(29,185,84,0.4) !important;
  flex-shrink: 0;
}

.home-section { margin-top: 32px; }
.home-section:last-child { padding-bottom: 100px; }
.home-section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; margin-bottom: 16px;
}
.home-section-title {
  font-size: 22px; font-weight: 900; color: var(--text-base);
  letter-spacing: -0.3px;
}
.home-section-see-all {
  font-size: 12px; font-weight: 700;
  color: var(--text-subdued);
  text-transform: uppercase; letter-spacing: 0.08em;
  cursor: pointer; transition: color 0.2s;
}
.home-section-see-all:hover { color: var(--text-base); }

.home-cards-scroll {
  display: flex; gap: 16px;
  padding: 4px 24px 16px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.home-cards-scroll::-webkit-scrollbar { display: none; }

.home-song-card {
  flex-shrink: 0; width: 168px;
  background: var(--bg-card);
  border-radius: 12px; padding: 16px;
  cursor: pointer;
  transition: background 0.2s, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  scroll-snap-align: start;
  animation: cardEntrance 0.4s ease both;
  position: relative; overflow: hidden;
}
.home-song-card:hover { background: var(--bg-card-hover); transform: translateY(-6px) scale(1.02); }
.home-song-card:active { transform: scale(0.97); }
.home-card-cover {
  width: 136px; height: 136px; border-radius: 8px;
  background: var(--bg-highlight);
  margin-bottom: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.home-card-cover img { width: 100%; height: 100%; object-fit: cover; }
.home-card-play-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
}
.home-song-card:hover .home-card-play-overlay { opacity: 1; }
.home-card-play-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: #000;
  transform: translateY(8px);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
  box-shadow: 0 8px 24px rgba(29,185,84,0.5);
}
.home-song-card:hover .home-card-play-btn { transform: translateY(0); }
.home-card-title {
  font-size: 13px; font-weight: 700; color: var(--text-base);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
}
.home-card-artist { font-size: 12px; color: var(--text-subdued); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-song-card.active-card .home-card-title { color: var(--accent); }
.home-song-card.active-card { box-shadow: 0 0 0 2px rgba(29,185,84,0.35); }

.search-view { padding: 0 32px 100px; }
.search-view-header { font-size: 26px; font-weight: 900; padding: 24px 0 16px; }

.view-tabs {
  display: flex; gap: 8px;
  padding: 0 32px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: sticky; top: 0; z-index: 5;
  background: var(--bg-elevated);
}
.view-tab {
  padding: 16px 4px; font-size: 14px; font-weight: 700;
  color: var(--text-subdued); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s; user-select: none;
}
.view-tab:hover { color: var(--text-base); }
.view-tab.active { color: var(--text-base); border-bottom-color: var(--accent); }

.albums-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 24px; padding: 24px 32px 100px;
}
.album-card {
  background: var(--bg-card); border-radius: var(--radius-md);
  padding: 16px; cursor: pointer;
  transition: background 0.2s, transform 0.2s;
  animation: cardEntrance 0.35s ease both;
  position: relative; overflow: hidden;
}
.album-card:hover { background: var(--bg-card-hover); transform: translateY(-4px); }
.album-card-cover {
  width: 100%; aspect-ratio: 1; border-radius: var(--radius-sm);
  object-fit: cover; background: var(--bg-highlight);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); overflow: hidden;
}
.album-card-cover img { width: 100%; height: 100%; object-fit: cover; }
.album-card-title { font-size: 14px; font-weight: 700; color: var(--text-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.album-card-artist { font-size: 12px; color: var(--text-subdued); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.album-card-count { font-size: 11px; color: var(--text-subdued); }
.album-play-btn {
  position: absolute; right: 16px; bottom: 70px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: #000;
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 8px 24px rgba(29,185,84,0.5);
}
.album-card:hover .album-play-btn { opacity: 1; transform: translateY(0); }

.btn-back-album {
  background: rgba(0,0,0,0.6); border: none; cursor: pointer;
  color: var(--text-base); font-size: 13px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: var(--radius-full);
  margin: 16px 32px 0; transition: background 0.2s;
}
.btn-back-album:hover { background: rgba(255,255,255,0.15); }
.main-header-bg {
  height: 280px;
  background: linear-gradient(180deg, #2d4a1e 0%, #1a2f12 50%, var(--bg-elevated) 100%);
  padding: 40px 32px 24px;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.main-cover-wrap { display: flex; align-items: flex-end; gap: 24px; }
.main-meta { padding-bottom: 8px; }
.main-type { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.main-detail { font-size: 13px; color: var(--text-subdued); display: flex; align-items: center; gap: 6px; }
.main-detail strong { color: var(--text-base); font-weight: 700; }
.main-actions {
  display: flex; align-items: center; gap: 24px;
  padding: 24px 32px;
}
.btn-play-big {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: #000;
  transition: transform 0.1s ease, background var(--transition);
  box-shadow: 0 8px 24px rgba(29,185,84,0.5);
}
.btn-play-big:hover { background: var(--accent-hover); transform: scale(1.05); }

.songs-table { padding: 0 24px 100px; }
.songs-table-header {
  display: grid; grid-template-columns: 40px 4fr 3fr 1fr;
  gap: 16px; padding: 0 16px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  color: var(--text-subdued); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em; align-items: center;
}
.song-row {
  display: grid; grid-template-columns: 40px 4fr 3fr 1fr;
  gap: 16px; padding: 8px 16px;
  border-radius: var(--radius-sm); align-items: center;
  cursor: pointer; transition: background var(--transition);
}
.song-row:hover { background: rgba(255,255,255,0.07); }
.song-row.active { background: rgba(255,255,255,0.07); }
.row-num { color: var(--text-subdued); font-size: 14px; text-align: center; font-weight: 500; position: relative; }
.row-num .play-hover {
  display: none; position: absolute; inset: 0;
  align-items: center; justify-content: center; color: var(--text-base);

<script>
// ========== ESTADO GLOBAL ==========
let songs = [];
let currentIndex = -1;
let isPlaying = false;
let isShuffle = false;
let repeatMode = 0;
let isMuted = false;
let isDragging = false;
let likedSongs = new Set();
let npPanelOpen = false;
let currentView = 'inicio';
let visibilityWasPaused = false;

const audio = document.getElementById('audio');
const progressEl = document.getElementById('progress');
const volumeEl = document.getElementById('volume');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');

// ========== LETRAS (Lyrics.ovh) ==========
async function fetchLyrics(artist, title) {
  const clean = (str) => str.replace(/[^\w\s]/gi, '').toLowerCase();
  try {
    const url = `https://api.lyrics.ovh/v1/${encodeURIComponent(clean(artist))}/${encodeURIComponent(clean(title))}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('No encontrada');
    const data = await res.json();
    return data.lyrics || 'Letra no disponible.';
  } catch(e) {
    return '❌ No se pudo obtener la letra. Asegúrate de que el artista y título sean correctos.';
  }
}

async function fetchLyricsForCurrentSong() {
  if (currentIndex < 0 || !songs[currentIndex]) { showToast('No hay canción activa'); return; }
  const song = songs[currentIndex];
  const lyricsBox = document.getElementById('lyrics-panel');
  if (!lyricsBox) return;
  lyricsBox.style.display = 'block';
  lyricsBox.innerHTML = '<div class="lyrics-loading"><div class="loading-spinner"></div> Buscando letra...</div>';
  const lyrics = await fetchLyrics(song.artist, song.title);
  lyricsBox.innerHTML = `<h4>🎤 ${escapeHtml(song.title)} – ${escapeHtml(song.artist)}</h4><div style="white-space:pre-wrap;">${escapeHtml(lyrics)}</div>`;
}
async function fetchLyricsForCurrentSongMobile() {
  if (currentIndex < 0 || !songs[currentIndex]) return;
  const song = songs[currentIndex];
  const container = document.getElementById('mpf-lyrics-container');
  if (!container) return;
  container.style.display = 'block';
  container.innerHTML = '<div class="lyrics-loading"><div class="loading-spinner"></div> Cargando letra...</div>';
  const lyrics = await fetchLyrics(song.artist, song.title);
  container.innerHTML = `<div style="white-space:pre-wrap;">${escapeHtml(lyrics)}</div>`;
}
